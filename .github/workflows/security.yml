name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "**/package*.json"
      - "**/pyproject.toml"
      - "**/requirements*.txt"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - ".github/workflows/security.yml"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for organisation repos;
      # the CLI itself is free (MIT), so run it directly.
      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: pip-audit when Python project present
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            pip install pip-audit
            pip-audit || true
          else
            echo "No Python dependency manifest — skip"
          fi
      - name: npm audit when Node project present
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || true
          else
            echo "No package.json — skip"
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
